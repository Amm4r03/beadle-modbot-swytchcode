<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beadle — the agent's journey</title>
<style>
  :root { --bg:#0a0d12; --card:#121824; --line:#212b3d; --text:#e8eef8; --dim:#8b98ad; --green:#43d17f; --amber:#e8b84b; --red:#e8615a; --accent:#7aa2f7; --soft:#1a2233; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(1200px 600px at 50% -200px, #131b2b 0%, var(--bg) 60%); color:var(--text); font:15px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; min-height:100vh; }
  .wrap { max-width:860px; margin:0 auto; padding:36px 20px 80px; }
  header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; }
  h1 { font-size:20px; margin:0; letter-spacing:.2px; }
  .dot { width:8px; height:8px; border-radius:99px; background:var(--green); display:inline-block; margin-right:8px; animation:pulse 2s infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  .sub { color:var(--dim); font-size:12px; }
  .picker { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .pill { border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:99px; padding:6px 12px; font-size:12px; cursor:pointer; }
  .pill.on { border-color:var(--accent); color:var(--accent); }
  .pill .b { margin-left:6px; font-size:11px; }
  .b.AUTO { color:var(--green); } .b.DRAFT { color:var(--amber); } .b.DENY { color:var(--red); }
  form { display:flex; gap:8px; margin-bottom:26px; }
  input { flex:1; background:var(--card); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:12px 14px; font-family:inherit; font-size:14px; }
  input:focus { outline:none; border-color:var(--accent); }
  button { background:var(--accent); border:0; color:#0a0d12; font-weight:700; border-radius:10px; padding:12px 18px; cursor:pointer; font-family:inherit; }
  .verdict { display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:26px; }
  .verdict .big { font-size:22px; font-weight:700; }
  .verdict .big.AUTO { color:var(--green); } .verdict .big.DRAFT { color:var(--amber); } .verdict .big.DENY { color:var(--red); }
  .verdict .why { color:var(--dim); font-size:13px; flex:1; }
  .journey { position:relative; padding-left:26px; }
  .journey:before { content:""; position:absolute; left:8px; top:6px; bottom:6px; width:1px; background:var(--line); }
  .step { position:relative; margin-bottom:14px; }
  .step:before { content:""; position:absolute; left:-22px; top:16px; width:9px; height:9px; border-radius:99px; background:var(--soft); border:1px solid var(--line); }
  .step.on:before { background:var(--accent); border-color:var(--accent); box-shadow:0 0 12px rgba(122,162,247,.5); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card h3 { margin:0 0 2px; font-size:14px; letter-spacing:.4px; }
  .card .what { color:var(--dim); font-size:12.5px; }
  .card .detail { margin-top:10px; font-size:12.5px; color:var(--text); white-space:pre-wrap; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .chip { border:1px solid var(--line); background:var(--soft); border-radius:8px; padding:3px 8px; font-size:11.5px; color:var(--dim); }
  .chip.hot { color:var(--amber); border-color:#5a4a1f; }
  .cite { color:var(--accent); }
  .empty { color:var(--dim); text-align:center; padding:40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="dot"></span>Beadle — the agent's journey</h1>
    <div class="sub" id="stamp">connecting…</div>
  </header>

  <div class="picker" id="picker"></div>
  <form id="chat">
    <input id="msg" placeholder="send a message into the community…" autocomplete="off">
    <button>Run</button>
  </form>

  <div id="verdict" class="verdict" style="display:none"></div>
  <div class="journey" id="journey"><div class="empty">pick an event, or send a message above.</div></div>
</div>

<script>
const j = async (u) => (await fetch(u)).json();
const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const STAGE = { received:["observe","normalized, deduped, written to the ledger"], signals_ready:["classify","8 deterministic signals + one batched Jev call"], decided:["gate","pure reducer — bands applied, reason templated"], drafted:["draft","answer composed from cited knowledge only"], approval_pending:["escalate","quarantine card placed in the human queue"], action_pending:["resolve","outbox intent — nothing external without it"], recorded:["learn","waiting for the human verdict"], learning_candidate:["learn","override recorded as a labeled example"] };
let current = null;

async function load() {
  const [prompts, events] = await Promise.all([j("/api/prompts"), j("/api/events?community_id=tg:maplenest&limit=8")]);
  document.getElementById("stamp").textContent = "updated " + new Date().toLocaleTimeString();
  if (!current && events.length) current = events[0].event_id;
  document.getElementById("picker").innerHTML = events.map((e) =>
    `<button class="pill ${e.event_id === current ? "on" : ""}" data-id="${esc(e.event_id)}">${esc(e.event_id)}<span class="b ${esc(e.band || "")}">${esc(e.band || "?")}</span></button>`
  ).join("");
  document.querySelectorAll(".pill").forEach((p) => p.addEventListener("click", () => { current = p.dataset.id; load(); }));
  if (!current) return;

  const trace = await j(`/api/trace/${current}`);
  const decision = trace.decisions[0] || {};
  const v = document.getElementById("verdict");
  v.style.display = "flex";
  v.innerHTML = `<div class="big ${esc(decision.band || "")}">${esc(decision.band || "?")}:${esc(decision.verdict || "?")}</div>
    <div class="why"><b>${esc(current)}</b> · conf ${decision.confidence != null ? Number(decision.confidence).toFixed(2) : "?"} · ${esc(decision.prompt_version || "")} ${esc(decision.result_status || "")}<br>${esc(decision.reason || "")}</div>`;

  const signals = trace.signals.filter((s) => !s.signal_version.includes("jev"));
  const jev = trace.signals.filter((s) => s.signal_version.includes("jev"));
  const draft = trace.drafts && trace.drafts[0] ? JSON.parse(trace.drafts[0].detail_json) : null;

  document.getElementById("journey").innerHTML = trace.transitions.map((t) => {
    const [name, what] = STAGE[t.to_state] || [t.to_state, t.reason_code || ""];
    let detail = "";
    if (t.to_state === "signals_ready") {
      detail = `<div class="chips">` + signals.map((s) => {
        let val = ""; try { val = JSON.parse(s.result_json).value; } catch {}
        return `<span class="chip ${val === "TRUE" || val === true ? "hot" : ""}">${esc(s.signal_version.split("@")[0])}: ${esc(val)}</span>`;
      }).join("") + jev.map((s) => {
        let v2 = ""; try { v2 = JSON.parse(s.result_json).value; } catch {}
        return `<span class="chip hot">${esc(s.signal_version.split("@")[0])}: ${v2 != null ? Number(v2).toFixed(2) : "?"}</span>`;
      }).join("") + `</div>`;
    } else if (t.to_state === "decided") {
      detail = `<div class="detail">${esc(t.reason_code)} — ${esc(decision.reason || "")}</div>`;
    } else if (t.to_state === "drafted" && draft) {
      detail = `<div class="detail">${esc(draft.text || "(escalated — no grounded draft)")}\n<span class="cite">sources: ${esc((draft.source_ids || []).join(", ") || "none")}</span></div>`;
    } else if (t.reason_code) {
      detail = `<div class="detail">${esc(t.reason_code)}</div>`;
    }
    return `<div class="step on"><div class="card"><h3>${esc(name)}</h3><div class="what">${esc(what)}</div>${detail}</div></div>`;
  }).join("") + `<div class="step"><div class="card"><h3>learn</h3><div class="what">${trace.overrides.length ? "admin resolved this case — stored as a labeled example" : "awaiting human verdict"}</div></div></div>`;
}

document.getElementById("chat").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;
  document.getElementById("journey").innerHTML = `<div class="empty">running the agent… (live Jev + draft)</div>`;
  input.value = "";
  try {
    const res = await fetch("/api/ingest", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
    const data = await res.json();
    current = data.event_id;
    load();
  } catch (err) {
    document.getElementById("journey").innerHTML = `<div class="empty">ingest failed: ${esc(err)}</div>`;
  }
});

load();
setInterval(load, 3000);
</script>
</body>
</html>
