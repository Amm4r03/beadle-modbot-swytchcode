# Jev Gate Config — Calibrated Community Operator

# Source: per-action thresholds from `docs/research-deepseek-searches.md` §(d) (learnjev/Vercel/Hakky/Bloss0m).
# Jev = decision layer only (no text, no tools). Swytchcode policy = tool broker (confidence ≠ authorization).
# Pin model version (`jev-latest` is an alias); log `model` + question version + policy version per decision (the trace is the wow).

model: "jev-pinned-2026-09-25 # TODO: replace with exact version string at build"
batching: "independent questions batched in one call (gate latency)"

# Noul (yes/no) has NO confidence field — threshold the yes-probability directly,
# with separate yes/no cutoffs + an uncertain band routed to draft/review.

gates:
  - action: "public_answer"
    question: "is this message safe + answerable from the lorebook?"
    type: "noul"
    auto_yes_at: 0.85
    uncertain_band: [0.60, 0.85]
    uncertain_route: "draft reply for mod approval, never auto-send"
    deny_below: 0.60
    deny_route: "escalate-with-context card to #mod-queue"

  - action: "scam_quarantine"
    question: "is this message an impersonation/scam pattern?"
    type: "noul"
    auto_block_at: 0.70
    # scam gate is deliberately LOWER than answer gate: false quarantine is
    # reversible (mod un-bans), false answer to a scam is not.
    block_route: "quarantine sender + pre-approved member warning + audit line + #mod-queue card"
    note: "pre-approved warning template may post without further approval"

  - action: "member_nudge"
    question: "is this lurker ready for one relevant nudge?"
    type: "score"
    auto_at: 0.80
    below_route: "leave silent; re-score next week"

  - action: "weekly_digest_send"
    question: "is the compiled report faithful to the underlying events?"
    type: "noul"
    auto_yes_at: 0.90
    uncertain_route: "mod reviews digest draft before Resend send"

  - action: "never_auto"
    list: ["payments", "deletions", "permission changes", "external-attendee contact"]
    route: "human approval always, regardless of confidence"

two_layer_rule: "Jev high-confidence STILL passes Swytchcode policy (tooling.json) before any exec — policy version logged per action."
demo_overrides: "none — demo runs the same thresholds against fixtures; MSG-A (0.88) clears auto-answer, MSG-B (0.93 scam) clears auto-block."
